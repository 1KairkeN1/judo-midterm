<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kodokan Judo Club - Tournament Table</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
         <img src="images/Black.png" alt="Logo" width="75" height="40">
         KODOKAN JUDO CLUB</a>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
    <li class="nav-item">
        <a class="nav-link fw-bold" href="index.html">Home</a>
    </li>
    <li class="nav-item">
        <a class="nav-link fw-bold" href="join.html">Schedule & Join</a>
    </li>
    <li class="nav-item">
        <a class="nav-link fw-bold" href="tournament.html">Tournaments</a>
    </li>
</ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card shadow-sm p-4 bg-white">
          <h2 class="fw-bold mb-3 text-center">Tournament Standings</h2>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <input type="text" id="searchInput" class="form-control" placeholder="Search by name">
            </div>
            <div class="col-md-6">
              <select id="weightFilter" class="form-select">
                <option value="all">All Weights</option>
                <option value="Lightweight">Lightweight (-66kg)</option>
                <option value="Middleweight">Middleweight (-81kg)</option>
                <option value="Heavyweight">Heavyweight (+81kg)</option>
              </select>
            </div>
          </div>

          <div id="ruleMessage" class="alert alert-warning d-none" role="alert"></div>

          <div class="alert alert-secondary d-flex justify-content-between align-items-center mb-3">
            <span>Total Tournament Points: <strong id="totalPointsDisplay">0</strong></span>
            <span>Active Competitors: <strong id="activeCountDisplay">0</strong></span>
          </div>

          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Competitor Name</th>
                  <th>Category</th>
                  <th>Wins</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="tournamentTableBody">
              </tbody>
            </table>
          </div>
          
          <div id="emptyMessage" class="text-center text-muted py-4 d-none">No competitors found.</div>

        </div>
      </div>
    </div>
</main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/tournament.js" defer></script>
</body>
</html>
